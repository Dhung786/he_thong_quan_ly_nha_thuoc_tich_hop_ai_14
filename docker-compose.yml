services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse_ai}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-warehouse_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Pharmacy AI - Group 14}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://warehouse:warehouse@postgres:5432/warehouse_ai}
      JWT_SECRET: ${JWT_SECRET:-INSECURE_DEV_ONLY_CHANGE_ME}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SEED_MANAGER_USERNAME: ${SEED_MANAGER_USERNAME:-manager}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-Manager123!ChangeMe}
      SEED_PHARMACIST_USERNAME: ${SEED_PHARMACIST_USERNAME:-pharmacist}
      SEED_PHARMACIST_PASSWORD: ${SEED_PHARMACIST_PASSWORD:-Pharmacist123!ChangeMe}
      SEED_CUSTOMER_USERNAME: ${SEED_CUSTOMER_USERNAME:-customer}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-Customer123!ChangeMe}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-700}
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres_data:
