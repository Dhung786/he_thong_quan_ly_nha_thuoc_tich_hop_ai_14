services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse_ai}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-warehouse_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Warehouse AI}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://warehouse:warehouse@postgres:5432/warehouse_ai}
      JWT_SECRET: ${JWT_SECRET:-INSECURE_DEV_ONLY_CHANGE_ME}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!ChangeMe}
      SEED_WAREHOUSE_KEEPER_USERNAME: ${SEED_WAREHOUSE_KEEPER_USERNAME:-keeper}
      SEED_WAREHOUSE_KEEPER_PASSWORD: ${SEED_WAREHOUSE_KEEPER_PASSWORD:-Keeper123!ChangeMe}
      SEED_ACCOUNTANT_USERNAME: ${SEED_ACCOUNTANT_USERNAME:-accountant}
      SEED_ACCOUNTANT_PASSWORD: ${SEED_ACCOUNTANT_PASSWORD:-Accountant123!ChangeMe}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres_data:
